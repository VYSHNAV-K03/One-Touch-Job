<html>
    <body>
        <form action="/add" method="POST" enctype="multipart/form-data">
         <div className="Basic details">
                <label>Photo</label>   <input type="file" name="image" className="image" /><br />
                <label>First Name</label><input type="text" name="first_name" className="name" required/><br />
                <label>Last Name</label><input type="text" name="last_name" className="name" required/><br />
               </div><br />
               <div className="Location">
               <label>Address</label><input type="text" name="address" required/><br />
               <label>City</label><input type="text" name="city" required/><br />
               <label>State</label><input type="text" name="state" required/><br />
                   </div><br />
               <div className="Conntact info">
               <label>Phone No</label><input type="text" pattern="[1-9]{1}[0-9]{9}" name="phone_number" required/><br />
               <label>Website</label><input type="text" name="website" /><br />
               <label>Email</label><input type="email" name="email" required/><br />
                   </div><br/>

                   <div class="edu">
                    <label>Institution Name</label><input type="text" name="institution_name" /><br/>
                    <label>Course</label><input type="text" name="course" /><br/>
                    <label>Grade</label><input type="text" name="grade" /><br/>
                    <label>Start Date</label><input type="date" name="start_date" /><br/>
                    <label>End Date</label><input type="date" name="end_date" /><br/>
                    <label>Description</label><input type="text" name="edu_description" /><br/>
                </div></br>
                
                <div class="certification">
                    <label>Course Name</label><input type="text" name="course_name" /><br/>
                    <label>Organisation</label><input type="text" name="cer_organisation" /><br/>
                    <label>Description</label><input type="text" name="cer_description" /><br/>

                </div>
                <div class="objective">
                    <label>Objective</label><br/>
                    <input type="text" name="objective" required/>
                </div>
                <div class="workexp">
                    <label>Organisation Name</label><input type="text" name="organisation_name" />
                    <label>Role</label><input type="text" name="role" />
                    <label>Start Date</label><input type="date" name="wrk_start_date" />
                    <label>End Date</label><input type="date" name="wrk_end_date" />
                    <label>Description</label><input type="text" name="wrk_description" />
                </div>
                <div>
                    <label>skill</label>
                    <input type="text" name="skill" />
                </div>  
                <div>
                    <label>hobbies</label>
                    <input type="text" name="hobbies"/>
                </div>
                <div>
                    <label>Language</label><input type="text" name="language" /><br/>
                    <label>Level </label><br/>
                    <select name="level">
                    <option value="beginner">Beginner</option>
                    <option value="proficient">Proficient</option>
                    <option value="expert">Expert</option>
                  </select><br/>
                  <label>Read</label><input type="checkbox" name="read" value=true />
                  <label>Write</label><input type="checkbox" name="write" value=true />
                  <label>Speak</label><input type="checkbox" name="speak" value=true />
                </div>
                   <input type="submit" name="submit"/>
        </form>
    </body>
